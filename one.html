<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>amricy sport - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="one.css">
    
</head>
<body>

    <div class="container vh-100 d-flex align-items-center justify-content-center">
        <div class="col-md-4">
            <div class="card login-card p-4 bg-white">
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-dark">amricy <span class="text-danger">sport</span></h2>
                    <p class="text-muted">Login to explore premium fitness gear</p>
                </div>
                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email address</label>
                        <input type="email" class="form-control" placeholder="name@example.com" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" class="form-control" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-brand w-100 py-2 fw-bold">Login</button>
                </form>
            </div>
        </div>
    </div>
<script src="one.js"></script>
</body>
</html>
